name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleDebug

    - uses: actions/upload-artifact@v4
      with:
        name: Dialer-debug.apk
        path: build/outputs/apk/debug/Dialer-debug.apk
